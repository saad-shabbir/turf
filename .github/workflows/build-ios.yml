name: Build unsigned iOS IPA
on:
  workflow_dispatch:
    inputs:
      configured_backend:
        description: Require configured Supabase (false for shell smoke build)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: turf-ios-manual
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      TURF_REQUIRE_BACKEND: ${{ inputs.configured_backend && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run test:db && npm run check:config
      - name: Pin CocoaPods in the runner's user gem directory
        run: |
          gem install cocoapods -v 1.17.0 --no-document --user-install
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Turf-unsigned
          retention-days: 1
          if-no-files-found: error
          path: |
            build/Turf-unsigned.ipa
            build/Turf-unsigned.ipa.sha256
            build/toolchain.txt
