name: ClassStreak checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run test:db && npm run check:config
      - run: bash -n scripts/build-ios-unsigned.sh scripts/verify-ipa.sh
      - run: python3 tests/ipa-inspection.test.py
